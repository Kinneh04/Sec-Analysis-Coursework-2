# Copy to configs/local.yaml and adjust paths on your machine.
paths:
  malware_corpus: 'E:\MalwareBazaar\extracted'
  malware_analysis_csv: 'E:\MalwareBazaar\analysis.csv'
  bn_cache_dir: 'E:\MalwareBazaar\labeler\cache\bn'
  benign_roots:
    - 'C:\Windows\System32'
    - 'C:\Windows\SysWOW64'
    # Harder benign: add licensed installed software (verify paths exist):
    - 'C:\Program Files\Mozilla Firefox'
    - 'C:\Program Files\7-Zip'
    - 'C:\Program Files\Git\cmd'
  artifacts_dir: './artifacts'
analysis:
  bn_mcp_url: 'http://127.0.0.1:24642/mcp'
  bn_v2_max_functions_per_file: 8
  max_bn_mcp_calls: 500
experiment:
  matched_cohort_target: 500
  max_malware_samples: 500
  max_benign_samples: 500
  benign_max_per_root: 120
  pilot_inventory_limit: 50
