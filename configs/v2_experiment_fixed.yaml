# V2 re-baseline after the import-bucket allow-list fix and fixed-threshold metrics.
# Writes to separate directories so earlier V2/audit outputs stay intact.
v2:
  seed: 42
  v1_config: configs/local.yaml
  mode: developmental
  primary_fpr: 0.01
  evaluation_claim: none

paths:
  artifacts_v2: ./artifacts/v2_fixed
  preregistration: docs/v2_preregistration.md
  feature_audit_dir: ./artifacts/feature_audit_fixed

development:
  use_splits: [train, val]
  inner_group_folds: 5
  threshold_calibration_fraction: 0.25
  selection_budget: 12

blind:
  enabled: false
  manifest: artifacts/v2_fixed/blind/manifest.json
  require_frozen_protocol: true
  write_once: true
  historical_test_replay:
    enabled: false

v1_baseline_tolerance:
  test_tpr_at_1pct_fpr: 1.0e-9
  paired_delta: 1.0e-6

protected_v1_globs:
  - manifests/split_assignments.parquet
  - manifests/cohort_frozen.json
  - manifests/frozen_*_sha256.txt
  - features/pe_features.parquet
  - features/bn_features_v2.parquet
  - evaluations/*
  - models/*
  - splits/*
