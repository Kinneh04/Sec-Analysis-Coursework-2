# SA2 V2 experiment configuration (does not modify V1 configs or artifacts).
v2:
  seed: 42
  v1_config: configs/local.yaml
  mode: developmental  # confirmatory requires independent blind cohort
  primary_fpr: 0.01
  evaluation_claim: none  # set only after blind evaluate-blind with frozen protocol

paths:
  artifacts_v2: ./artifacts/v2
  preregistration: docs/v2_preregistration.md
  feature_audit_dir: ./artifacts/feature_audit

development:
  use_splits: [train, val]
  inner_group_folds: 5
  threshold_calibration_fraction: 0.25
  selection_budget: 12  # max grid cells scored per inner CV (see preregistration)

blind:
  enabled: true
  manifest: artifacts/v2/blind/manifest.json
  require_frozen_protocol: true
  write_once: true
  # Pipeline replay on V1 frozen TEST (already examined in V1). NOT confirmatory blind.
  historical_test_replay:
    enabled: true
    manifest_sha_file: artifacts/manifests/frozen_test_sha256.txt
    confirmatory: false
    label: v1_frozen_test_historical_replay

v1_baseline_tolerance:
  test_tpr_at_1pct_fpr: 1.0e-9
  paired_delta: 1.0e-6

protected_v1_globs:
  - manifests/split_assignments.parquet
  - manifests/cohort_frozen.json
  - manifests/frozen_*_sha256.txt
  - features/pe_features.parquet
  - features/bn_features_v2.parquet
  - evaluations/*
  - models/*
  - splits/*
