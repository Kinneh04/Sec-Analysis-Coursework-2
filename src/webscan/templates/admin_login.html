{% extends "base_public.html" %}
{% block title %}Sign in · SA2 Scan{% endblock %}
{% block body %}
<section class="login">
  <h1>Admin sign in</h1>
  <form method="post">
    <label>Password<input type="password" name="password" autofocus required></label>
    <button class="btn-solid">Sign in</button>
  </form>
  <p class="muted small">The password is printed in the dashboard console window at start-up (or set <code>SA2_ADMIN_PASSWORD</code>).</p>
</section>
{% endblock %}
