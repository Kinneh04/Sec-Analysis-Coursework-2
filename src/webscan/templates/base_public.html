<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,">
<title>{% block title %}SA2 Scan{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='scan.css') }}">
</head>
<body class="public {% block bodyclass %}{% endblock %}">
<header class="vt-top">
  <a class="vt-mark" href="{{ url_for('home') }}" aria-label="SA2 Scan home">
    <svg viewBox="0 0 40 40" width="28" height="28"><path d="M4 4h32v32H4z M4 4l16 16L4 36" fill="none" stroke="currentColor" stroke-width="3.5"/></svg>
  </a>
  <form class="vt-search" action="{{ url_for('search') }}" method="get">
    <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2"/></svg>
    <input name="q" placeholder="File hash (SHA-256 / SHA-1 / MD5), file name or imphash" value="{{ request.args.get('q', '') }}">
  </form>
  <nav class="vt-actions">
    <a href="{{ url_for('home') }}" title="Upload">Upload</a>
    <a href="{{ url_for('api_doc') }}">API</a>
    {% if is_admin %}<a class="btn-outline" href="{{ url_for('admin_hud') }}">Admin</a>
    {% else %}<a class="btn-outline" href="{{ url_for('admin_login') }}">Sign in</a>{% endif %}
  </nav>
</header>
{% with msgs = get_flashed_messages() %}{% if msgs %}<div class="flash">{% for m in msgs %}<p>{{ m }}</p>{% endfor %}</div>{% endif %}{% endwith %}
<main>{% block body %}{% endblock %}</main>
<script src="{{ url_for('static', filename='scan.js') }}"></script>
</body>
</html>
